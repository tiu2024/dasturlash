          - "2. Operatsion tizimlar va Windows": courses/axv/topic-02.md
          - "3. O'lchov birliklari, fayllar va papkalar": courses/axv/topic-03.md
          - "4. Asosiy va qo'shimcha qurilmalar": courses/axv/topic-04.md
          - "5. Internet, brauzerlar va elektron pochta": courses/axv/topic-05.md
