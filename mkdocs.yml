site_name: Kurslar
site_description: "Kurslar - ma'ruzalar va materiallar"
# After creating your GitHub repository, add:
site_url: https://tiu2024.github.io/dasturlash/
theme:
  name: material
  favicon: assets/favicon.png
  logo: assets/favicon.png
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
extra_css:
  - assets/extra.css
plugins:
  - search
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
nav:
  - Bosh sahifa: index.md
  - "Dasturlash 1, 2":
      - Kurs haqida: courses/dasturlash/index.md
      - AI bilan ishlash: courses/dasturlash/ai-guide.md
      - 1-hafta. Dasturlashga kirish: courses/dasturlash/week-01/lecture.md
      - 2-hafta. Python dasturlashga kirish:
          - Ma'ruza: courses/dasturlash/week-02/lecture.md
          - Amaliyot: courses/dasturlash/week-02/practice.md
      - 3-hafta. Funksiyalar, shartlar, scope va turlar:
          - Ma'ruza: courses/dasturlash/week-03/lecture.md
          - Amaliyot: courses/dasturlash/week-03/practice.md
      - 4-hafta. Looplar va stringlar:
          - Ma'ruza: courses/dasturlash/week-04/lecture.md
          - Amaliyot: courses/dasturlash/week-04/practice.md
      - 5-hafta. Ro'yxatlar va kortejlar: courses/dasturlash/week-05/lecture.md
  - Mobil ilovalar yaratish:
      - Kurs haqida: courses/mobil-ilovalar/index.md
      - AI bilan ishlash: courses/mobil-ilovalar/ai-guide.md
      - 4-hafta. Kotlin tilida sinflar va obyektlar:
          - Ma'ruza: courses/mobil-ilovalar/week-04/lecture.md
          - Amaliyot: courses/mobil-ilovalar/week-04/practice.md
  - AXV:
      - Kurs haqida: courses/axv/index.md
      - AI bilan ishlash: courses/axv/ai-guide.md
      - "I bob. Kompyuter savodxonligi va arxitekturasi":
