# 5-ma'ruza. Ro'yxatlar va kortejlar. Elementlarni qo'shish, o'zgartirish va o'chirish.
# Reference materials (not cited, examples are our own): python.sariq.dev 07-09,
# programming-26.mooc.fi part-4/3, part-4/6, part-5/1, part-5/2 (references = key topic).
# Build from the project root:
#   .venv/Scripts/python.exe .claude/skills/dasturlash-ppt/scripts/build_lecture.py Lectures/src/week-05/lecture.yaml
#
# Agreed plan (approved by the teacher, 80 min)
#   Warm-up (week 4) .................. 4
#   Problem: no collections ........... 7   (30 variables; ball overwritten; fixed parameters)
#   1. Ro'yxat ........................ 13  (index/slice/for/in as in week 4; list changes, str does not)
#   2. Qo'shish va o'chirish .......... 15  (append, insert, pop/del, remove, in-check, quiz)
#   3a. Kortej ........................ 5
#   3b. Havolalar (references) ........ 16  (b = a, [:], function changes list, sort/sorted, side effect)
#   4. To'plam (set) .................. 10  (no repeats, no index, add/discard/remove, set(list))
#   Live coding 5 + activity 4 + summary table 1 + recap/exit 2
# Decisions: lecture title as is; no list()/tuple() conversion; set(list) only for removing repeats;
# no union/intersection; no citations; students already know for/range/index/slice/in/len (week 4).
config: ../../config.yaml

meta:
  title: "Ro'yxatlar va kortejlar"
  subtitle: "5-ma'ruza · elementlarni qo'shish, o'zgartirish va o'chirish"
  duration_min: 80
  deck_file: "../../5_Royxatlar va kortejlar.pptx"

objectives:
  - "Ro'yxat yaratib, elementni indeks bo'yicha **olib o'zgartira oladi**"
  - "`append`, `insert`, `pop`, `remove` va `del` farqini **tushuntira oladi**"
  - "Ro'yxat, kortej va to'plamni **taqqoslay oladi**"
  - "`b = a` va `b = a[:]` farqini **tushuntira oladi**"

livecode:
  run: ".venv/Scripts/python.exe mehmonlar.py"
  files:
    - name: mehmonlar.py
      starter: |
        # Mehmonlar ro'yxati
        # 1) mehmonlar = ["Ali", "Vali", "Hasan"]
        # 2) "Olim" ni qo'shing
        # 3) "Vali" ni o'chiring
        # 4) birinchi mehmonni pop bilan oling va "Ketdi: ..." deb chiqaring
        # 5) qolganlarni for bilan chiqaring va ularning sonini ayting
        # 6) kelganlar ro'yxatidan nechta turli odam borligini toping
      solution: |
        mehmonlar = ["Ali", "Vali", "Hasan"]
        mehmonlar.append("Olim")
        mehmonlar.remove("Vali")
        birinchi = mehmonlar.pop(0)
        print("Ketdi:", birinchi)
        for mehmon in mehmonlar:
            print(mehmon)
        print("Mehmonlar soni:", len(mehmonlar))
        kelganlar = ["Ali", "Vali", "Ali", "Hasan", "Vali"]
        print("Turli odamlar:", len(set(kelganlar)))
    - name: qosh.py
      starter: |
        def qosh(royxat):
            royxat.append(10)


        sonlar = [1, 2, 3]
        qosh(sonlar)
        print(sonlar)
      solution: |
        def qosh(royxat):
            yangi = royxat[:]
            yangi.append(10)
            return yangi


        sonlar = [1, 2, 3]
        yangi = qosh(sonlar)
        print(sonlar)
        print(yangi)

slides:
  - type: title
    notes: "Salomlashing. Bugun bitta qiymat o'rniga ko'p qiymatni birga saqlashni o'rganamiz: ro'yxat, kortej va to'plam. Eng muhim qismi dars o'rtasida: ikki o'zgaruvchi bitta ro'yxatga ishora qilganda nima bo'ladi."

  - type: retrieval
    headline: "O'tgan haftadan uchta savol"
    items:
      - q: "`for i in range(1, 4): print(i)` nimani chiqaradi?"
        a: "1, 2, 3 — `range` da oxirgi son (4) kirmaydi"
      - q: "`print(\"Termiz\"[1:4])` nimani chiqaradi?"
        a: "erm — 1-indeksdan 4-indeksgacha, 4 kirmaydi"
      - q: "`a = 5`, `b = a`, `b = 6` dan keyin `print(a)` nimani chiqaradi?"
        a: "5 — `b = 6` faqat `b` ni o'zgartiradi"
    minutes: 3.5
    notes: "Talabalar javobni daftarga yozsin, keyin 2-3 kishidan so'rang. Birinchi ikki savol bugungi dars uchun kerak: indeks va kesim ro'yxatda ham xuddi shunday ishlaydi. Uchinchi savolga e'tibor bering: sonlarda b = a nusxa beradi. Dars o'rtasida ro'yxatlarda bu boshqacha ekanini ko'ramiz."

  - type: hook
    question: "Guruhda 30 ta talaba bor. Hammasining ismini chiqarish uchun 30 ta o'zgaruvchi va 30 ta print yozasizmi?"
